name: Test model

on: push

jobs:
  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434 
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      # Use same OLLAMA_MODEL in src/kubeshield/model.py
      - name: Download model
        run: docker exec ${{ job.services.ollama.id }} ollama pull llama3.2:1b

      - name: Ask the model about a scan summary
        run: uv run scripts/test_model.py
