name: CI

on: push

jobs:
  scan-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest

      - name: Make kind cluster
        uses: helm/kind-action@v1

      - name: Install kubescape
        run: |
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | bash
          echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"

      - name: Start server
        run: |
          # Not `uv run`: it would hold uv's cache lock until the job ends,
          # and setup-uv's cleanup would time out waiting for it
          .venv/bin/uvicorn kubeshield.server:app > server.log 2>&1 &
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8000/health

      - name: Deploy vulnerable workload
        run: |
          kubectl apply -f manifests/vuln-test-workload.yaml
          kubectl rollout status deployment/vuln-test-workload --timeout=90s

      - name: Scan cluster and check results
        run: |
          curl --silent --show-error --max-time 180 http://localhost:8000/scan > scan.json
          jq . scan.json
          jq -e '.failed_controls | length > 0' scan.json

      - name: Show server log
        if: failure()
        run: cat server.log

  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      # Use same OLLAMA_MODEL in src/kubeshield/model.py
      - name: Download model
        run: docker exec ${{ job.services.ollama.id }} ollama pull llama3.2:1b

      - name: Ask the model about a scan summary
        run: uv run scripts/test_model.py
