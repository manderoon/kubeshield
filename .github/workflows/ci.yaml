name: CI

on: [push, pull_request]

jobs:
  scan-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install uv && uv sync

      - name: Make kind cluster
        uses: helm/kind-action@v1

      - name: Install kubescape
        run: |
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash
          echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"

      # Must start after kubescape is installed: the server only sees the
      # PATH it was started with.
      - name: Start server
        run: scripts/start-server.sh

      - name: Deploy vulnerable workload
        run: scripts/deploy-vuln-test-workload.sh

      - name: Scan cluster and check results
        run: scripts/scan.sh

      - name: Show server log
        if: failure()
        run: cat server.log
