[project]
name = "kubeshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mandana Ebrahimian", email = "75654442+manderoon@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kubeshield = "kubeshield:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
